abstract: |
  A common class of subduction zone thermal models assumes slab-mantle coupling near 70--80 km depth and thin backarc lithospheres, based on surface heat flow profiles from a small number of well-instrumented subduction zone segments. These models implicitly assume along-strike continuity over hundreds of kilometers. We tested this assumption by applying ordinary Kriging to 60,316 surface heat flow measurements across 34 subduction zone domains, comparing Krige and Similarity interpolations point-by-point, and applying cross-correlation function (CCF) analysis to 201 adjacent trench-perpendicular transect pairs. Four well-sampled domains (Japan, Cascadia, Sumatra, and Kermadec--Hikurangi) show sustained continuity consistent with observations and both interpolation methods. Three other well-sampled domains (Kurils--Kamchatka, Central America--Panama, and Ryukyus--Sagami) show abrupt along-strike changes at 100--150 km scales, rendering single-profile characterizations misleading. Two domains (Caribbean and Izu--Bonin) exhibit systematic disagreement between methods. Most transects (168/235; 71%) have $\leq$ 25 observations, which is too sparse for independent assessment. In well-sampled settings, Similarity mischaracterizes along-strike correlations while Kriging tracks local observations closely. In sparse settings, only Similarity provides plausible surface heat flow estimates. Critically, method agreement does not guarantee accuracy. For Izu--Bonin, 190 local observations contradict both interpolation methods. For the Caribbean, the two methods displace a structural boundary by 100--150 km relative to its inferred location. This analysis shows that the accuracy of thermal models cannot be determined from the existing surface heat flow record. Improvement will require strategically targeted surveys and hybrid Kriging--Similarity approaches guided by the failure-mode diagnostics defined here.
plain_language_summary: |
  When one tectonic plate dives beneath another at a subduction zone, the two plates lock together and drive flow of warm rock in Earth's mantle. Scientists measure the heat escaping through Earth's surface to locate this "sticking-point" because its depth controls earthquake hazards. For decades, a few intensely studied regions were used to identify a sticking-point depth of 70--80 km, assuming that a single cross-section could represent the thermal structure for hundreds of kilometers laterally. We tested this assumption by analyzing more than 60,000 heat flow measurements across 34 subduction zone segments worldwide using two independent mapping methods. Thermal structure was consistent in four well-studied regions, supporting the conventional model, but thermal structure changed abruptly over distances of 100--150 km in three other well-sampled regions, challenging the conventional model's assumptions. Two additional regions gave contradictory results, while nearly three quarters of all regions had too few measurements to evaluate thermal structure. Importantly, in one region, both methods indicate a uniform thermal structure while 190 measurements directly contradict that conclusion; agreement does not prove accuracy. Improving the subduction zone thermal models requires strategically placed field surveys combined with mapping strategies that integrate local measurements and geological patterns in a principled way.
keypoints:
